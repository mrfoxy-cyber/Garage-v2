name: UML diagrams

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build UML tooling
        run: dotnet build tools/uml/Uml.csproj --configuration Release
      - name: Test change detection
        run: dotnet run --no-build --configuration Release --project tools/uml -- self-test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test interactive graph layout
        run: node tools/uml/graph-layout-tests.js
      - name: Check diagrams and review status
        # Generated drift fails. Review flags are advisory; add --strict to require acknowledgements.
        run: dotnet run --no-build --configuration Release --project tools/uml -- check
      - name: Validate full PlantUML syntax
        if: always()
        shell: pwsh
        run: ./tools/uml/render.ps1 -CheckOnly
      - name: Render SVG previews
        if: always()
        shell: pwsh
        run: ./tools/uml/render.ps1
      - name: Publish check summary
        if: always()
        shell: bash
        run: |
          if [ -f docs/uml/reports/check.md ]; then
            cat docs/uml/reports/check.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload diagrams and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garage-uml
          path: docs/uml/
          retention-days: 14
